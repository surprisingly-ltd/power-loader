name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    # Actions minutes: CI runs on the public repo only (free there); see tools/ci-local.sh.
    if: github.repository == 'surprisingly-ltd/power-loader'
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: javascript-typescript, actions
          queries: security-extended
          config-file: ./.github/codeql.yml
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

  dependency-review:
    name: dependency-review
    if: github.repository == 'surprisingly-ltd/power-loader' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, CC0-1.0, BlueOak-1.0.0, Python-2.0, CC-BY-4.0, Unlicense
          comment-summary-in-pr: on-failure

  osv:
    # Actions minutes: CI runs on the public repo only (free there); see tools/ci-local.sh.
    if: github.repository == 'surprisingly-ltd/power-loader'
    name: osv
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-24.04
      scan-args: |-
        --lockfile=pnpm-lock.yaml

  secrets:
    # Actions minutes: CI runs on the public repo only (free there); see tools/ci-local.sh.
    if: github.repository == 'surprisingly-ltd/power-loader'
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          set -euo pipefail
          file=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose .'

  workflows:
    # Actions minutes: CI runs on the public repo only (free there); see tools/ci-local.sh.
    if: github.repository == 'surprisingly-ltd/power-loader'
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          persona: regular
