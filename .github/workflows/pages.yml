name: Pages

# Builds and deploys https://powerloader.surprisingly.ltd: the homepage, privacy and reviewer notes, the
# demo, and the signed releases with updates.json (which installed copies poll through update_url).
on:
  push:
    branches: [main]
    paths:
      - site/**
      - demo/**
      - tools/**
      - extension/manifest.json
      - extension/lib/**
      - README.md
      - REVIEWERS.md
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pages serves only deployments made from the default branch, not from a release's tag, so a published
  # release redeploys from main (where fetch-releases picks it up) instead of deploying here.
  redeploy-from-main:
    name: redeploy from main
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    # Actions minutes: CI runs on the public repo only (free there); see tools/ci-local.sh.
    if: github.repository == 'surprisingly-ltd/power-loader'
    name: build
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      latest: ${{ steps.expected.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: $/.github/actions/setup
      - name: Signed releases (published only)
        run: node tools/fetch-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build:site
      - name: Every link, anchor and site address resolves
        run: pnpm check:site
      - id: expected
        name: The latest release this build serves
        run: |
          node -e '
            const list = Object.values(require("./dist/site/updates.json").addons)[0].updates;
            const last = list[list.length - 1];
            console.log("latest=" + (last ? `${last.version} ${last.update_hash.replace("sha256:", "")}` : ""));
          ' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: smoke
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: The live site serves this build (pages, updates.json and the latest XPI)
        env:
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          set -euo pipefail
          site=https://powerloader.surprisingly.ltd
          # Pages' CDN caches for up to 10 minutes, including 404s from before the deploy: wait for it.
          live() {
            for path in / /setup /try /create /play /privacy /reviewers /demo/ /demo/library/library.json /updates.json /game/; do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "$site$path")" = 200 ] || { echo "not yet: $path"; return 1; }
            done
            [ -z "$LATEST" ] && return 0
            read -r version hash <<< "$LATEST"
            curl -sf "$site/updates.json" | grep -q "\"version\": \"$version\"" || { echo "not yet: updates.json lists $version"; return 1; }
            curl -sf "$site/download/power-loader-latest.xpi" -o latest.xpi || { echo "not yet: latest XPI"; return 1; }
            echo "$hash  latest.xpi" | sha256sum -c --quiet - || { echo "not yet: latest XPI hash"; return 1; }
          }
          for attempt in $(seq 1 24); do
            if live; then echo "Live: ${LATEST:-no signed releases yet}"; exit 0; fi
            sleep 30
          done
          echo "The live site didn't serve this build within 12 minutes"; exit 1
