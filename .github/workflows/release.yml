name: Release

# On a v* tag: check, build (twice: CI and from the source archive), sign through AMO (unlisted, after a
# maintainer approves the `release` environment), then a draft GitHub Release with checksums, an SBOM and
# build provenance. Publishing the draft deploys it to the site, where installed copies pick it up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        name: The tag is the manifest version, on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./extension/manifest.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG doesn't match manifest version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm check:vendor
      - run: pnpm check:lint
      - run: pnpm build:ext
      - run: pnpm bundle:source
      - name: Rebuild from the source archive and compare
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          unzip -q "dist/power-loader-${VERSION}-src.zip" -d "$work/src"
          (cd "$work/src" && pnpm install --frozen-lockfile && pnpm build:ext)
          unzip -q "dist/power-loader-${VERSION}.zip" -d "$work/ci"
          unzip -q "$work/src/dist/power-loader-${VERSION}.zip" -d "$work/rebuilt"
          diff -r "$work/ci" "$work/rebuilt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: dist/power-loader-*.zip
          if-no-files-found: error

  sign:
    name: sign (AMO, unlisted)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: inputs
      - name: Sign the exact package CI built
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          src=$(mktemp -d)
          unzip -q "inputs/power-loader-${VERSION}.zip" -d "$src"
          npx web-ext sign --channel=unlisted --source-dir "$src" --artifacts-dir signed \
            --upload-source-code "inputs/power-loader-${VERSION}-src.zip" --amo-metadata amo-metadata.json \
            --approval-timeout 3000000
          mv signed/*.xpi "signed/power-loader-${VERSION}.xpi"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed/power-loader-*.xpi
          if-no-files-found: error

  publish:
    name: draft release
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: cyclonedx-json
          output-file: out/power-loader-${{ needs.build.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: out
        run: sha256sum power-loader-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/power-loader-*.xpi
            out/power-loader-*.zip
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --generate-notes --title "Power Loader ${TAG#v}" -R "$GITHUB_REPOSITORY" out/*
